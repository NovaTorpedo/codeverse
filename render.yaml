# Render Blueprint: CodeVerse public site (static, no server, no environment variables).
# Node version comes from .nvmrc. Headers below are generated; refresh them with `npm run render:headers`.
services:
  - type: web
    name: codeverse
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./apps/viewer/out
    headers:
      # BEGIN security headers (generated by scripts/render-headers.mjs; do not edit by hand)
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-DGubuwyBBVslD8vY4rz9iHfVNIR5L+Ei0agpiJjzKRE=' 'sha256-OBTN3RiyCV4Bq7dFqZ5a2pAXjnCcCYeTJMO2I/LYKeo=' 'sha256-kfRmRwXbiWF5AUTR4hXWyfiIIoNFn6t+f9BKzmwiPqE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: "same-origin"
      - path: /_next/static/chunks/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /data/*
        name: Cache-Control
        value: "public, max-age=300"
      # END security headers
